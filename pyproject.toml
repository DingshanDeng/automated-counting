[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellcount"
version = "0.1.0"
description = "Utilities for the Cell Image Counting project (data loading, EDA, splits)."
requires-python = ">=3.10"
# Lower bounds only, so Colab's preinstalled packages are reused instead of reinstalled.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "imagehash>=4.3",
    "tqdm>=4.65",
    "roboflow>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4.0", "ipykernel>=6.25", "nbstripout>=0.7", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
